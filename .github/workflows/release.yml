# Builds, signs, notarizes and publishes mport when a version tag such as v1.2.0 is pushed.
#
# One-time setup: add these repository secrets (Settings → Secrets and variables → Actions):
#
#   DEVELOPER_ID_CERTIFICATE_P12       Your "Developer ID Application" certificate and its private key, exported
#                                      from Keychain Access as a .p12, then base64-encoded:
#                                        base64 -i DeveloperID.p12 | pbcopy
#   DEVELOPER_ID_CERTIFICATE_PASSWORD  The password you gave the .p12 when exporting it.
#   DEVELOPER_ID_IDENTITY              The certificate's name, e.g. "Developer ID Application: Your Name (TEAMID)".
#                                        security find-identity -v -p codesigning   lists it.
#   NOTARY_APPLE_ID                    The Apple ID of your developer account.
#   NOTARY_TEAM_ID                     Your team ID (the 10 characters in parentheses above).
#   NOTARY_PASSWORD                    An app-specific password for that Apple ID, made at https://account.apple.com.
#
# To release: update the version in mport/Mport.swift, mport/ConfigureDefaults.swift and
# mport/RegisterConnection.swift, commit, then:
#
#   git tag v1.2.0 && git push origin v1.2.0

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode on the runner
        run: |
          XCODE="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          sudo xcode-select --switch "$XCODE"
          xcodebuild -version
          swift --version

      # The integration tests skip themselves (there's no MongoDB here), and so does the Keychain test, which sees
      # CI through TEST_RUNNER_CI: xcodebuild passes only TEST_RUNNER_-prefixed variables on to the tests.
      - name: Test
        env:
          TEST_RUNNER_CI: "true"
        run: |
          xcodebuild test \
            -project mport.xcodeproj -scheme mport -destination 'platform=macOS' \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM=

      - name: Build a universal binary
        run: |
          swift build -c release --arch arm64 --arch x86_64
          BIN="$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)/mport"
          lipo -archs "$BIN"
          echo "BIN=$BIN" >> "$GITHUB_ENV"

      - name: Check the version matches the tag
        run: |
          BUILT="$("$BIN" --version)"
          if [ "$BUILT" != "${VERSION#v}" ]; then
            echo "::error::mport --version says $BUILT, but the tag is $VERSION. Update the version in the sources."
            exit 1
          fi

      - name: Import the signing certificate
        env:
          CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -P "$CERTIFICATE_PASSWORD" -f pkcs12 -k "$KEYCHAIN" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"

      - name: Sign
        env:
          IDENTITY: ${{ secrets.DEVELOPER_ID_IDENTITY }}
        run: |
          codesign --force --options runtime --timestamp --sign "$IDENTITY" "$BIN"
          codesign --verify --strict --verbose=2 "$BIN"

      - name: Package
        run: |
          NAME="mport-${VERSION#v}"
          mkdir -p "dist/$NAME"
          cp "$BIN" LICENSE README.md THIRD_PARTY_NOTICES.md "dist/$NAME/"
          ditto -c -k --norsrc --noextattr --keepParent "dist/$NAME" "dist/$NAME-macos.zip"
          echo "ZIP=dist/$NAME-macos.zip" >> "$GITHUB_ENV"

      # A bare command-line binary can't have its notarization ticket stapled to it; macOS looks it up online the
      # first time the binary runs.
      - name: Notarize
        env:
          APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          xcrun notarytool submit "$ZIP" --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$PASSWORD" --wait

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shasum -a 256 "$ZIP" | tee "$ZIP.sha256"
          gh release create "$VERSION" "$ZIP" "$ZIP.sha256" --title "mport ${VERSION#v}" --generate-notes

      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
